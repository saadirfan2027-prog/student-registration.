      <h1><a href="index.html">Home</a></h1><br><br>
    <form action="thanks.html" method="get">
        <img src="student.png" alt="Student Profile"
     class="profile" width="300">
        <label for="fn">Full name:</label>
        <input type="text" id="fn" name="fullname"
        placeholder="Your name" required><br><br>

        <label for="Registaration">Registration number: </label>
        <input type="text" id="Registaration" name="ID number" required><br><br>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="phn">Phone:</label>
        <input type="tel" id="phn" placeholder="03XXXXXXXXX" ><br><br>
        <label for="age">Age: </label>
        <input id="age" type="number" min="16" max="40"><br><br>
        <label for="dob">Date of Birth: </label>
        <input id="dob" type="date" ><br><br>
        Gender:
        <input type="radio" name="Gender" value="Male">Male
        <input type="radio" name="Gender" value="Female">Female<br><br>

        <label for="dp">Departent:</label>
        <select id="dp" name="dp">
            <option>Ai</option>
            <option>CS</option>
            <option>SE</option>
        </select> <br><br>
        Interests:
        <input type="checkbox" name="interest" value="Web">Web
        <input type="checkbox" name="interest" value="Ai">Ai
        <input type="checkbox" name="interest" value="Games">Games<br><br>
        <label for="address">Address:</label> <br><br>
        <textarea name="address" rows="4"></textarea><br><br>

       <button type="submit">Submit Form</button><br><br>
        <input type="reset" name="Reset Form" >
    </form>
</body>
</html>
